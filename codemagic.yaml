workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios
          pod install
          cd ..
      - name: Install fastlane
        script: |
          gem install fastlane -NV
          fastlane install_plugins
      - name: Build iOS
        script: |
          flutter build ios --release
      - name: Code Signing
        script: |
          fastlane match appstore
